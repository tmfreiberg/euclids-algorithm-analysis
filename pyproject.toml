[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euclid-analysis"
version = "1.0.0"
description = "Analysis of the number of division steps in Euclid's algorithm: implementations, large-scale frequency tables, distribution statistics, and comparison with the Gaussian limit."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tristan Freiberg" }]
keywords = [
    "euclidean-algorithm",
    "number-theory",
    "gcd",
    "fibonacci",
    "dynamic-programming",
    "distribution",
    "central-limit-theorem",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]
# What Quarto's Jupyter engine needs to execute the book's code cells.
docs = [
    "ipykernel>=6.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/tmfreiberg/euclids-algorithm-analysis"
Documentation = "https://tmfreiberg.github.io/euclids-algorithm-analysis/"
Repository = "https://github.com/tmfreiberg/euclids-algorithm-analysis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests that regenerate frequency data (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
# The mathematics uses capitalised names for the objects it studies -- the
# checkpoint N, the frequency tables A, B, C, H, H1, and the constants module
# aliased as C. The naming rules N802/N803/N806/N811/N812 are therefore relaxed
# so the code can match the exposition's notation.
ignore = ["D203", "D213", "N802", "N803", "N806", "N811", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
# Checked as source files, so a bare "mypy" works with an editable install,
# and at the version of whichever interpreter runs it (CI runs each one).
files = ["src/euclid_analysis"]
ignore_missing_imports = true

[tool.deptry]
known_first_party = ["euclid_analysis"]
# The extras hold tools (test, lint, book rendering), not imports.
optional_dependencies_dev_groups = ["dev", "docs"]

[project.scripts]
euclid-analysis = "euclid_analysis.cli:main"
ea = "euclid_analysis.cli:main"
